[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
test    = "test"
script  = "script"
solc    = "0.8.20"

# Optimizer — important for lower gas on Celo
optimizer         = true
optimizer_runs    = 200

# Celo EVM compatibility
evm_version = "paris"

# Remappings — maps @openzeppelin/ to lib/openzeppelin-contracts
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Test verbosity — feel free to change during development
verbosity = 2

# ─── RPC Endpoints ────────────────────────────────────────────────────────────

[rpc_endpoints]
alfajores = "https://alfajores-forno.celo-testnet.org"
celo      = "https://feth.celo.org"

# ─── Block Explorer Verify ────────────────────────────────────────────────────

[etherscan]
# Get API key from: https://celoscan.io/myapikey
celo      = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api" }
alfajores = { key = "${CELOSCAN_API_KEY}", url = "https://api-alfajores.celoscan.io/api" }

# ─── Fuzz Config ─────────────────────────────────────────────────────────────

[fuzz]
runs = 256
